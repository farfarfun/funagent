[project]
name = "funagent"
version = "0.2.1"
description = "farfarfun 组织内共享的 AI 子智能体（subagent）角色定义集合，覆盖产品 PRD、技术设计、前后端实现与项目编排"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = []

# 本仓库只分发 agent/*.md 角色定义，不构建 Python 发行包，
# pyproject.toml 仅用于用 uv 管理测试与 lint 工具链。
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.14"]

[tool.ruff]
target-version = "py310"
